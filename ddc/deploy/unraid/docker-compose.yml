# InvoiceShelf (Drone Data Command build): stack for Unraid Docker Compose Manager.
#
# A stack of its own, separate from the drone-data-command stack, so updating
# or restarting one never touches the other. "Update Stack" pulls the image
# the ddc-image workflow published and recreates the container. Settings come
# from this stack's .env file (template: .env.example next to this file).

name: invoiceshelf-ddc

services:
  invoiceshelf:
    image: ghcr.io/bmanwithab/invoiceshelf-ddc:${INVOICESHELF_DDC_TAG:-latest}
    container_name: invoiceshelf-ddc
    restart: unless-stopped
    ports:
      - "${INVOICESHELF_PORT:-8091}:8080"
    volumes:
      - ${INVOICESHELF_DATA_DIR:-/mnt/user/appdata/invoiceshelf-ddc}/storage:/var/www/html/storage
      - ${INVOICESHELF_DATA_DIR:-/mnt/user/appdata/invoiceshelf-ddc}/modules:/var/www/html/Modules
    environment:
      - APP_NAME=${APP_NAME:-Drone Data Command Invoicing}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/app/database.sqlite # please don't touch this!
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=240
      - SESSION_DOMAIN=${APP_DOMAIN}
      - SANCTUM_STATEFUL_DOMAINS=${APP_DOMAIN}
    labels:
      net.unraid.docker.icon: "${INVOICESHELF_ICON_URL:-https://ddc.howard-techworks.io/unraid-icons/ddc-app/icon-256.png}"
      net.unraid.docker.webui: "${APP_URL}"
